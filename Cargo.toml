[package]
name = "duocle"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "A desktop focus utility for macOS and Windows"

[dependencies]
anyhow = "1.0"
directories = "6.0"
fs2 = "0.4"
image = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
base64 = "0.22"
global-hotkey = "0.10"
tao = "0.37"
tray-icon = "0.25"
url = "2.5"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-service-management = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry",
    "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3"

[profile.release]
strip = "symbols"
lto = "thin"
