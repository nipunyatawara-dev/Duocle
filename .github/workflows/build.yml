name: Build Duocle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Duocle-macos-universal
          path: dist/Duocle-macos-universal.zip

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: |
          choco install nsis --yes --no-progress
          $env:Path += ';C:\Program Files (x86)\NSIS;C:\Program Files\NSIS'
          scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Duocle-windows-x64
          path: dist/Duocle-windows-x64-setup.exe
